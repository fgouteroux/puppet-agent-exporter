---
project_name: puppet-agent-exporter
before:
  hooks:
    - go mod tidy
builds:
  - binary: puppet-agent-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # Keep in sync with .promu.yml so that `--version` reports the same
      # information no matter which toolchain produced the binary.
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.FullCommit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{.Date}}
nfpms:
  - package_name: puppet-agent-exporter
    formats:
      - deb
    license: Apache 2.0
    homepage: https://github.com/fgouteroux/puppet-agent-exporter
    maintainer: François Gouteroux <francois.gouteroux@gmail.com>
    description: Prometheus Exporter for Puppet Agent
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^chore\(ci\):'
      - '^chore\(deps\):'
      - '^docs:'
      - '^test:'
